# Hacker News Digest - Nginx config
# Serves static files behind Cloudflare (orange cloud)
# Rate limits by real client IP via CF-Connecting-IP header
# Defense in depth: user-agent blocking, security headers, hidden file denial

limit_req_zone $limit_ip zone=scrape:10m rate=1r/m;
limit_req_status 429;

# Use real client IP: CF-Connecting-IP when behind Cloudflare, remote_addr otherwise
map $http_cf_connecting_ip $limit_ip {
    ~^.+$ $http_cf_connecting_ip;
    default $remote_addr;
}

# Defense in depth: known scraper user-agents (easily spoofed, not primary defense)
map $http_user_agent $bad_bot {
    default 0;
    ~*(GPTBot|Claude-Web|CCBot|ChatGPT-User|Google-Extended|anthropic-ai|Bytespider|Imagesift|Diffbot|DataForSeo|PetalBot|AhrefsBot|SemrushBot|MegaIndex|SeznamBot|BLEXBot|Exabot|MJ12bot) 1;
}

server {
    listen 80;
    server_name HackerNews.mrityunjay.dev;

    root /var/www/hacker-news/output;
    index index.html;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Block scrapers by user-agent (easily spoofed, just noise reduction)
    if ($bad_bot) {
        return 403;
    }

    # Rate limit: 1 req/min per real IP (uses CF-Connecting-IP behind orange cloud)
    # Burst of 3 allows quick page loads for real users without 429 errors
    # Static/image paths also get rate-limited but are served from CF edge cache
    # in practice (365d/7d TTL), so origin sees mostly uncached page requests.
    location / {
        limit_req zone=scrape burst=3 nodelay;
        try_files $uri $uri/ =404;
    }

    # Static assets: no rate limit, immutable cache
    location /static/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Cached images: no rate limit
    location /image/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        return 404;
    }

    # Deny access to database and backup files
    location ~ \.(db|sqlite|bak|log|env)$ {
        deny all;
        return 404;
    }

    # gzip for text responses
    gzip on;
    gzip_types text/html text/plain text/css application/javascript text/javascript application/xml application/atom+xml application/json;
    gzip_min_length 1000;
    gzip_vary on;
}
